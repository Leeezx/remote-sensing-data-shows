limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=area_rate:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=tile_rate:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=client_conn:10m;
proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=tile_cache:20m max_size=1g inactive=7d use_temp_path=off;

map $upstream_status $skip_tile_cache {
    200 0;
    default 1;
}

server {
    listen 8080;
    server_name _;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    client_max_body_size 1M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /api/query/area {
        limit_req zone=api_rate burst=20 nodelay;
        limit_req zone=area_rate burst=3 nodelay;
        limit_conn client_conn 4;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_rate burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /cog/ {
        limit_req zone=tile_rate burst=50 nodelay;
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_no_cache $skip_tile_cache $upstream_http_set_cookie;
        proxy_cache_bypass $upstream_http_set_cookie;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location ~ ^/data/(?:ssm|raster|irrigation)-tiles/ {
        limit_req zone=tile_rate burst=50 nodelay;
        proxy_cache tile_cache;
        proxy_cache_valid 200 7d;
        proxy_no_cache $skip_tile_cache $upstream_http_set_cookie;
        proxy_cache_bypass $upstream_http_set_cookie;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /data/ {
        limit_req zone=api_rate burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
}
