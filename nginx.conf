# ===== Nginx configuration =====
# Serves frontend static files + proxies API requests to backend

server {
    listen 80;
    server_name _;

    # Increase upload size for area queries
    client_max_body_size 10M;

    # ===== Frontend static files =====
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: serve index.html for any unmatched route
        try_files $uri $uri/ /index.html;
    }

    # ===== Long-term cache for hashed assets =====
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===== API proxy to backend =====
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer timeout for spatial queries on large rasters
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ===== Static tile proxy (legacy pre-generated tiles) =====
    location /data/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tile responses can be cached
        proxy_read_timeout 30s;
    }

    # ===== COG dynamic tile proxy (TiTiler) =====
    location /cog/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tile rendering can be CPU-intensive
        proxy_read_timeout 60s;
    }

    # ===== Security headers =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== Gzip compression =====
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
}
