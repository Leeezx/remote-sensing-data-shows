# ===== Docker Compose — 遥感数据展示平台 =====
#
# 快速启动:
#   1. 复制 .env.example 为 .env 并修改配置
#   2. 确保 data/rasters/ 下有 COG 栅格数据
#   3. docker compose up -d --build
#   4. 访问 http://<服务器IP>

services:
  # ===== Backend: FastAPI + TiTiler =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rs-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # 仅本地回环暴露，通过 nginx 代理访问
    volumes:
      # 栅格数据（45GB+ COG 文件，不需要打包进镜像）
      - ./data/rasters:/app/data/rasters:ro
      # 矢量数据（shapefile/GeoJSON）
      - ./data/vectors:/app/data/vectors:ro
    environment:
      # ---- 安全配置 ----
      - SECRET_KEY=${SECRET_KEY:-}
      # ---- CORS ----
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      # ---- 灌溉数据源路径（用于扫描可用时间）----
      # 如果源栅格也在 data/rasters/ 下，可以设为:
      #   IRRIGATION_ANNUAL_ROOT=/app/data/rasters/irrigation_annual_source
      #   IRRIGATION_8DAY_ROOT=/app/data/rasters/irrigation_8day_source
      - IRRIGATION_ANNUAL_ROOT=${IRRIGATION_ANNUAL_ROOT:-/app/data/rasters/irrigation_annual}
      - IRRIGATION_8DAY_ROOT=${IRRIGATION_8DAY_ROOT:-/app/data/rasters/irrigation_8day}
      # ---- COG 瓦片数据路径 ----
      - IRRIGATION_ANNUAL_COG_ROOT=${IRRIGATION_ANNUAL_COG_ROOT:-/app/data/rasters/irrigation_annual}
      - IRRIGATION_8DAY_COG_ROOT=${IRRIGATION_8DAY_COG_ROOT:-/app/data/rasters/irrigation_8day}
      # ---- GDAL 配置 ----
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_CACHEMAX=${GDAL_CACHEMAX:-512}
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ===== Frontend: Nginx + React SPA =====
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ===== 可选: HTTPS 证书自动续期 =====
  # 使用前请:
  #   1. 取消下方注释
  #   2. 将 your-domain.com 替换为实际域名
  #   3. 将 frontend ports 改为 "80:80"（certbot 需要 80 端口验证）
  #   4. 运行: docker compose up -d
  #   5. 首次获取证书:
  #      docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #        -d your-domain.com --email your-email@example.com --agree-tos --non-interactive
  #   6. 将 frontend ports 改为以下映射:
  #      - "80:80"
  #      - "443:443"
  #   7. 取消 nginx.conf 中 SSL 相关配置注释
  #   8. 重新部署: docker compose up -d --build
  #
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: rs-certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
